<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Swarm GSC Map Prototype</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    * { box-sizing: border-box; }
    html,body { height: 100%; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #container { display: flex; height: 100%; }
    #map { flex: 1; }
    #sidebar { width: 350px; background: #f8f9fa; overflow-y: auto; border-left: 1px solid #ddd; }
    #info { padding: 12px; background: #e3f2fd; border-bottom: 1px solid #ddd; font-size: 13px; }
    #drones-section { padding: 12px; }
    h3 { margin-top: 0; margin-bottom: 8px; font-size: 14px; }
    #drones-table { width: 100%; font-size: 12px; border-collapse: collapse; }
    #drones-table th { background: #f0f0f0; padding: 6px; text-align: left; font-weight: 600; border-bottom: 1px solid #ddd; }
    #drones-table td { padding: 6px; border-bottom: 1px solid #eee; }
    #drones-table tr:hover { background: #f5f5f5; }
    .status-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .status-connected { background: #d4edda; color: #155724; }
    .status-disconnected { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div id="container">
    <div id="map"></div>
    <div id="sidebar">
      <div id="info">Click map to set target for connected drones</div>
      <div id="drones-section">
        <h3>🚁 Connected Drones</h3>
        <table id="drones-table">
          <thead>
            <tr>
              <th>Drone ID</th>
              <th>Status</th>
              <th>Lat</th>
              <th>Lon</th>
              <th>Battery</th>
            </tr>
          </thead>
          <tbody id="drones-tbody">
            <tr><td colspan="5" style="text-align: center; color: #999;">Waiting for drones...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm', paint: { 'raster-fade-duration': 0 } }]
      },
      center: [0, 0],
      zoom: 2,
      fadeDuration: 0
    });
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    const droneState = {}; // { drone_id: { lat, lon, alt, battery, status } }
    let markers = {};
    let tableUpdatePending = false;
    let markerRefreshPending = false;

    function isInCurrentView(lat, lon) {
      const bounds = map.getBounds();
      if (!bounds) return true;
      return bounds.contains([lon, lat]);
    }

    function upsertMarkerIfVisible(id) {
      const state = droneState[id];
      if (!state || state.status !== 'connected' || state.lat === undefined || state.lon === undefined) {
        if (markers[id]) {
          markers[id].remove();
          delete markers[id];
        }
        return;
      }

      if (!isInCurrentView(state.lat, state.lon)) {
        if (markers[id]) {
          markers[id].remove();
          delete markers[id];
        }
        return;
      }

      if (!markers[id]) {
        markers[id] = new maplibregl.Marker()
          .setLngLat([state.lon, state.lat])
          .setPopup(new maplibregl.Popup({ offset: 12 }).setText(id))
          .addTo(map);
      } else {
        markers[id].setLngLat([state.lon, state.lat]);
      }
    }

    function refreshVisibleMarkers() {
      Object.keys(droneState).forEach((id) => upsertMarkerIfVisible(id));
    }

    function scheduleTableUpdate() {
      if (tableUpdatePending) return;
      tableUpdatePending = true;
      requestAnimationFrame(() => {
        tableUpdatePending = false;
        updateDroneTable();
      });
    }

    function scheduleMarkerRefresh() {
      if (markerRefreshPending) return;
      markerRefreshPending = true;
      requestAnimationFrame(() => {
        markerRefreshPending = false;
        refreshVisibleMarkers();
      });
    }

    map.on('moveend', scheduleMarkerRefresh);
    map.on('zoomend', scheduleMarkerRefresh);
    map.on('load', scheduleMarkerRefresh);
    
    // Connect to backend WebSocket
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/frontend');
    
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        
        if (msg.type === 'telemetry') {
          const id = msg.drone_id;
          const p = msg.payload || {};
          const lat = p.lat || 0;
          const lon = p.lon || 0;
          const battery = p.battery || 'N/A';
          
          // Update drone state
          if (!droneState[id]) {
            droneState[id] = { status: 'connected' };
          }
          droneState[id].lat = lat;
          droneState[id].lon = lon;
          droneState[id].battery = battery;

          upsertMarkerIfVisible(id);
          scheduleTableUpdate();
          
        } else if (msg.type === 'connect') {
          const id = msg.drone_id;
          if (!droneState[id]) {
            droneState[id] = {};
          }
          droneState[id].status = 'connected';
          console.log('✅ drone connected:', id);
          scheduleTableUpdate();
          scheduleMarkerRefresh();
          
        } else if (msg.type === 'disconnect') {
          const id = msg.drone_id;
          if (droneState[id]) {
            droneState[id].status = 'disconnected';
          }
          if (markers[id]) {
            markers[id].remove();
            delete markers[id];
          }
          console.log('❌ drone disconnected:', id);
          scheduleTableUpdate();
          
        } else if (msg.type === 'command_sent') {
          console.log('📤 command sent to:', msg.to);
        }
      } catch(e) {
        console.error('❌ WebSocket parse error:', e);
      }
    };
    
    ws.onerror = (err) => {
      console.error('❌ WebSocket error:', err);
    };
    
    ws.onopen = () => {
      console.log('✅ Frontend connected to backend');
    };
    
    // Update the drone table
    function updateDroneTable() {
      const tbody = document.getElementById('drones-tbody');
      const drones = Object.entries(droneState)
        .filter(([, state]) => state.status === 'connected')
        .sort((a, b) => a[0].localeCompare(b[0]));
      
      if (drones.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">No connected drones</td></tr>';
        return;
      }
      
      tbody.innerHTML = drones.map(([id, state]) => {
        const isConnected = state.status === 'connected';
        const statusClass = isConnected ? 'status-connected' : 'status-disconnected';
        const statusText = isConnected ? 'On' : 'Off';
        const lat = (state.lat !== undefined) ? state.lat.toFixed(5) : '-';
        const lon = (state.lon !== undefined) ? state.lon.toFixed(5) : '-';
        const battery = (state.battery !== undefined) ? (typeof state.battery === 'number' ? state.battery.toFixed(1) : state.battery) : '-';
        
        return `<tr>
          <td><strong>${id}</strong></td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>${lat}</td>
          <td>${lon}</td>
          <td>${battery}%</td>
        </tr>`;
      }).join('');
    }

    // Map click handler
    map.on('click', (e) => {
      const lat = e.lngLat.lat.toFixed(6);
      const lon = e.lngLat.lng.toFixed(6);
      const connectedCount = Object.values(droneState).filter(d => d.status === 'connected').length;
      
      if (connectedCount === 0) {
        alert('❌ No drones connected');
        return;
      }
      
      const popup = new maplibregl.Popup({ closeOnClick: true })
        .setLngLat([parseFloat(lon), parseFloat(lat)])
        .setHTML(`<div><strong>Target:</strong><br>Lat: ${lat}<br>Lon: ${lon}<br><button id="sendBtn">Send to ${connectedCount} drone(s)</button></div>`)
        .addTo(map);
      
      setTimeout(()=>{
        const btn = document.getElementById('sendBtn');
        if (btn) {
          btn.onclick = () => {
            fetch('/command', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ target: { lat: parseFloat(lat), lon: parseFloat(lon) }, drones: 'all' })
            })
            .then(r => r.json())
            .then(j => {
              console.log('✅ Response:', j);
              alert('Command sent to: ' + (j.sent || []).join(', ') || 'No drones');
              popup.remove();
            })
            .catch(err => {
              console.error('❌ Command error:', err);
              alert('Command failed');
            });
          };
        }
      }, 100);
    });
  </script>
</body>
</html>
