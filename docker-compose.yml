services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mapping
      POSTGRES_USER: mapping
      POSTGRES_PASSWORD: mapping
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapping -d mapping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.11-slim
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mapping:mapping@db:5432/mapping
    volumes:
      - ./:/app
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  sim:
    image: python:3.11-slim
    depends_on:
      - backend
    volumes:
      - ./:/app
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && python drone_sim.py --id sim1"

volumes:
  postgis_data:
