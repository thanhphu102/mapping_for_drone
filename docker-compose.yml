services:
  backend:
    image: python:3.12-slim
    volumes:
      - ./:/app
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 9002"
    ports:
      - "9002:9002"

  sim:
    image: python:3.12-slim
    depends_on:
      - backend
    volumes:
      - ./:/app
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && python drone_sim.py --id sim1 --host backend --port 9002"
